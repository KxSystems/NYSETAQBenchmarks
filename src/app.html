<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<script>
			// Runs before first paint: resolve the theme and start the data fetch early.
			(function () {
				var theme = null;
				try {
					theme = localStorage.getItem('theme');
				} catch (e) {}
				if (theme !== 'light' && theme !== 'dark') {
					theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				}
				document.documentElement.setAttribute('data-theme', theme);

				var m = /[?&]size=([a-z0-9_-]+)/i.exec(location.search);
				var size = m ? m[1] : 'full';
				var link = document.createElement('link');
				link.rel = 'preload';
				link.as = 'fetch';
				link.crossOrigin = 'anonymous';
				link.href = '/data/' + size + '.json';
				document.head.appendChild(link);

				// Google Tag Manager, not on local development or preview hosts.
				if (!/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) {
					window.dataLayer = window.dataLayer || [];
					window.dataLayer.push({ 'gtm.start': Date.now(), event: 'gtm.js' });
					var g = document.createElement('script');
					g.async = true;
					g.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-PG938LS';
					document.head.appendChild(g);
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="off">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
